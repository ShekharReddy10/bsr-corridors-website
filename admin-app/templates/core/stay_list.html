{% extends "base.html" %}
{% block title %}Stays{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Stays</h1>
  <a class="btn btn-primary hide-mobile" href="{% url 'stay_new' %}">+ New stay</a>
</div>

<form class="filters" method="get" hx-get="{% url 'stay_list' %}" hx-target="#stay-rows" hx-trigger="input changed delay:300ms from:input[name=q], change" hx-push-url="true">
  <input type="search" name="q" value="{{ q }}" placeholder="Search name or phone" aria-label="Search name or phone" autocomplete="off">
  <select name="status" aria-label="Status">
    <option value="">All statuses</option>
    {% for v, l in statuses %}<option value="{{ v }}" {% if status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
  </select>
  <select name="room" aria-label="Room">
    <option value="">All rooms</option>
    {% for r in rooms %}<option value="{{ r.pk }}" {% if room == r.pk|stringformat:"s" %}selected{% endif %}>Room {{ r.number }}</option>{% endfor %}
  </select>
  <select name="source" aria-label="Booked via">
    <option value="">All sources</option>
    {% for v, l in sources %}<option value="{{ v }}" {% if source == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
  </select>
  <label class="inline">From <input type="date" name="start" value="{{ start|date:'Y-m-d' }}"></label>
  <label class="inline">To <input type="date" name="end" value="{{ end|date:'Y-m-d' }}"></label>
  <noscript><button class="btn btn-outline">Filter</button></noscript>
</form>

<div id="stay-rows">{% include "partials/stay_rows.html" %}</div>
{% endblock %}
