{% extends "base.html" %}
{% block title %}Change my password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change my password</h1><a class="btn btn-ghost" href="{% url 'settings' %}">Back</a></div>
<form method="post" class="card">{% csrf_token %}
  <div class="form-grid">
    <div class="field span-2"><label for="p-cur">Current password</label><input id="p-cur" type="password" name="current" autocomplete="current-password" required></div>
    <div class="field"><label for="p-new">New password <small class="muted">(at least {{ min_length }} characters)</small></label><input id="p-new" type="password" name="password" minlength="{{ min_length }}" autocomplete="new-password" required></div>
    <div class="field"><label for="p-confirm">Repeat new password</label><input id="p-confirm" type="password" name="confirm" minlength="{{ min_length }}" autocomplete="new-password" required></div>
  </div>
  <div class="form-actions"><button class="btn btn-primary">Change password</button></div>
</form>
{% endblock %}
