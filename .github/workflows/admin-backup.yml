# Nightly Google Drive backup for the admin app (02:00 IST).
# Repo → Settings → Secrets and variables → Actions:
#   ADMIN_APP_URL       e.g. https://bsr-corridors-admin.onrender.com
#   ADMIN_BACKUP_TOKEN  same value as BACKUP_TOKEN in Render
name: Admin nightly backup

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 02:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the app (free instances sleep)
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${{ secrets.ADMIN_APP_URL }}/healthz/"
      - name: Run backup
        run: |
          curl -fsS --max-time 240 -X POST \
            -H "X-Backup-Token: ${{ secrets.ADMIN_BACKUP_TOKEN }}" \
            "${{ secrets.ADMIN_APP_URL }}/backup/run/"
