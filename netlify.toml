[build]
  command = "npm run build"
  publish = "out"
  # Skip website builds when only the admin app or docs changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)admin-app' ':(exclude)docs' ':(exclude)render.yaml' ':(exclude).github/workflows/admin-backup.yml'"

[build.environment]
  NODE_VERSION = "22"

# Website /admin → the Django admin app on Render.
# If Render gives the app a different address, change it here (both lines).
[[redirects]]
  from = "/admin"
  to = "https://bsr-corridors-admin.onrender.com/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://bsr-corridors-admin.onrender.com/:splat"
  status = 302
  force = true
